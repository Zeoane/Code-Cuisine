<div class="relative flex min-h-[100svh] flex-col overflow-hidden bg-forest">
  <app-hero-plates />

  <div class="relative z-20 mx-auto flex w-full max-w-[1440px] flex-1 flex-col px-4 sm:px-[65px] sm:pb-12">
    <header class="flex h-[52px] shrink-0 items-center justify-between sm:h-auto sm:pt-10">
      <a routerLink="/" aria-label="Code à Cuisine – Home" class="tap-target">
        <app-logo klass="h-8 w-auto sm:h-12" />
      </a>
      <app-logout-button
        klass="flex h-11 w-11 shrink-0 items-center justify-center text-creme/70 transition-colors hover:text-creme" />
    </header>

    <main class="flex flex-1 flex-col items-start justify-start gap-10 pt-11 sm:justify-center sm:gap-12 sm:py-10">
      <div
        class="flex w-full flex-col items-start gap-2 max-w-[calc(100%-var(--plate)*0.42)] sm:gap-0 sm:max-w-[calc(100%-var(--plate)*0.42-16px)] lg:max-w-[calc(100%-var(--plate)-70px)] min-[1440px]:max-w-[755px]">
        <p
          class="font-quicksand max-w-[200px] text-[min(24px,6.6vw)] leading-[1.25] font-semibold text-beige sm:max-w-none sm:text-[32px] sm:leading-normal lg:text-[40px] xl:text-5xl">
          AI-Powered recipe generator
        </p>
        <h1
          class="font-ubuntu text-[clamp(38px,15vw,64px)] leading-[1.125] font-bold text-creme sm:text-[64px] sm:leading-[1.15] lg:text-[80px] xl:text-[104px]">
          Code à Cuisine
        </h1>
      </div>
      <a
        routerLink="/generator"
        (click)="startFresh()"
        class="font-quicksand flex h-[52px] items-center justify-center bg-creme px-[18px] text-base font-semibold text-leaf transition-transform duration-150 ease-out sm:h-[60px] sm:px-[26px] sm:text-2xl hover:brightness-105 active:scale-[0.97]">
        Get started
      </a>
    </main>

    <div
      class="flex max-w-[calc(100%-var(--plate)*0.42)] flex-col items-start gap-2 mb-[max(0px,calc(100svh-112px-2.3*var(--plate)))] sm:mb-0 sm:max-w-[calc(100%-var(--plate)*0.42-16px)] lg:max-w-none">
      <div class="flex flex-col items-start gap-4 sm:flex-row sm:flex-wrap sm:items-center">
        <p class="font-ubuntu text-2xl leading-[1.1] font-medium text-creme sm:text-[32px] sm:leading-normal">
          Hungry for inspiration?
        </p>
        <a
          routerLink="/cookbook"
          class="font-quicksand group flex h-[52px] items-center justify-center gap-2.5 rounded-[5px] px-0 py-4 text-xl font-medium whitespace-nowrap text-creme transition-colors duration-150 ease-out sm:px-[26px] hover:bg-white/10 active:scale-[0.97]">
          Go to cookbook
          <app-icon
            name="arrow-right"
            klass="w-6 transition-transform duration-150 ease-out group-hover:translate-x-1" />
        </a>
      </div>
      <button
        type="button"
        (click)="impressumOpen.set(true)"
        class="font-quicksand flex min-h-11 items-center text-base text-creme/60 underline-offset-4 transition-colors hover:text-creme hover:underline">
        Imprint
      </button>
    </div>
  </div>

  <app-impressum-modal [open]="impressumOpen()" (closed)="impressumOpen.set(false)" />
</div>
