<div class="relative flex min-h-[100svh] flex-col overflow-hidden bg-forest">
  <app-hero-plates />

  <!-- Header, hero and footer line share one container, so the logo starts
       exactly where the headline starts - on a 1920px screen the header used to
       keep its 68px to the window edge while the content was centred, which put
       the logo 172px to the left of everything below it. -->
  <div class="relative z-20 mx-auto flex w-full max-w-[1440px] flex-1 flex-col px-4 pb-8 sm:px-[65px] sm:pb-12">
    <!-- 52px tall on a phone, the height of the design's mobile menu bar, so
         the 44px down to the headline below is measured from the same edge. -->
    <header class="flex h-[52px] shrink-0 items-center justify-between sm:h-auto sm:pt-10">
      <a routerLink="/" aria-label="Code à Cuisine – Home" class="tap-target">
        <app-logo klass="h-8 w-auto sm:h-12" />
      </a>
      <app-logout-button
        klass="flex h-11 w-11 shrink-0 items-center justify-center text-creme/70 transition-colors hover:text-creme" />
    </header>

    <!-- From sm up the hero centres itself between header and footer line
         instead of being pushed down by a fixed padding and then leaving a gap
         at the bottom of a tall screen. On a phone Figma anchors it 44px below
         the header, where centring put it 127px down. -->
    <main class="flex flex-1 flex-col items-start justify-start gap-10 pt-11 pb-10 sm:justify-center sm:gap-12 sm:py-10">
      <!-- The width is capped against the plate column: the headline used to
           run 72px into the plates on an iPad and 239px at 1024px. -->
      <div
        class="flex w-full flex-col items-start gap-2 max-w-[calc(100%-var(--plate)*0.42+16px)] sm:gap-0 sm:max-w-[calc(100%-var(--plate)*0.42-16px)] lg:max-w-[calc(100%-var(--plate)-70px)] min-[1440px]:max-w-[755px]">
        <!-- A subtitle, not a section heading: as an h2 it came before the
             h1 in the document, so a screen reader opened the page one level
             down and then jumped back up. -->
        <p
          class="font-quicksand max-w-[200px] text-2xl leading-[1.25] font-semibold text-beige sm:max-w-none sm:text-[32px] sm:leading-normal lg:text-[40px] xl:text-5xl">
          AI-Powered recipe generator
        </p>
        <h1
          class="font-ubuntu text-[clamp(44px,17vw,64px)] leading-[1.125] font-bold text-creme sm:text-[64px] sm:leading-[1.15] lg:text-[80px] xl:text-[104px]">
          Code à Cuisine
        </h1>
      </div>
      <a
        routerLink="/generator"
        (click)="startFresh()"
        class="font-quicksand flex h-[52px] items-center justify-center bg-creme px-[18px] text-base font-semibold text-leaf transition-transform duration-150 ease-out sm:h-[60px] sm:px-[26px] sm:text-2xl hover:brightness-105 active:scale-[0.97]">
        Get started
      </a>
    </main>

    <!-- In the normal flow now. As an absolutely positioned block with four
         hardcoded top values it sat wherever those pixels pointed, which is
         what left the large empty area underneath on tablets. -->
    <div class="flex max-w-[calc(100%-var(--plate)*0.42-16px)] flex-col items-start gap-2 lg:max-w-none">
      <div class="flex flex-col items-start gap-4 sm:flex-row sm:flex-wrap sm:items-center">
        <p class="font-ubuntu text-2xl leading-[1.1] font-medium text-creme sm:text-[32px] sm:leading-normal">
          Hungry for inspiration?
        </p>
        <a
          routerLink="/cookbook"
          class="font-quicksand group flex h-[52px] items-center justify-center gap-2.5 rounded-[5px] px-0 py-4 text-xl font-medium text-creme transition-colors duration-150 ease-out sm:px-[26px] hover:bg-white/10 active:scale-[0.97]">
          Go to cookbook
          <app-icon
            name="arrow-right"
            klass="w-6 transition-transform duration-150 ease-out group-hover:translate-x-1" />
        </a>
      </div>
      <button
        type="button"
        (click)="impressumOpen.set(true)"
        class="font-quicksand flex min-h-11 items-center text-base text-creme/60 underline-offset-4 transition-colors hover:text-creme hover:underline">
        Imprint
      </button>
    </div>
  </div>

  <app-impressum-modal [open]="impressumOpen()" (closed)="impressumOpen.set(false)" />
</div>
