<div class="flex min-h-screen flex-col gap-16 bg-white pb-16">
  <header
    class="mx-auto flex w-full max-w-[1466px] flex-col gap-9 px-4 pt-6 sm:px-[68px] sm:pt-10"
  >
    <a routerLink="/" aria-label="Code à Cuisine – Home" class="w-fit">
      <app-logo variant="color" klass="h-10 w-auto sm:h-12" />
    </a>

    <div class="flex flex-col">
      <button
        type="button"
        (click)="goBack()"
        class="font-quicksand flex w-fit items-center gap-2.5 text-base font-medium text-forest transition-colors hover:text-deep-green"
      >
        <img src="assets/img/arrow-back.svg" alt="" class="h-[14px] w-5" />
        Cookbook
      </button>

      <button
        type="button"
        (click)="generate()"
        class="font-quicksand flex items-center gap-2.5 self-end bg-forest px-[26px] py-4 text-2xl leading-[30px] font-semibold text-creme transition-colors hover:bg-[#2d4c2d]"
      >
        Generate a recipe
      </button>
    </div>
  </header>

  <main class="mx-auto flex w-full max-w-[1466px] flex-col gap-10 px-4 sm:px-[68px]">
    <div class="relative">
      <img [src]="banner()" alt="" class="w-full" />
      <h1
        class="font-quicksand absolute inset-0 flex items-center justify-center text-[40px] leading-[1.04] font-bold text-deep-green"
      >
        {{ category().label }}
      </h1>
    </div>

    <ol class="flex flex-col">
      @for (recipe of recipes(); track recipe.id; let i = $index) {
        <li>
          <button
            type="button"
            (click)="openRecipe(recipe)"
            class="flex w-full items-center gap-4 rounded-2xl px-4 py-3 text-left transition-colors hover:bg-mist/40"
          >
            <span
              class="font-quicksand flex h-8 w-8 shrink-0 items-center justify-center rounded-full bg-peach text-base leading-none font-semibold text-deep-green"
            >
              {{ rowNumber(i) }}
            </span>

            <span class="flex min-w-0 flex-1 flex-col gap-1">
              <span
                class="font-quicksand flex items-center gap-1.5 text-base leading-5 font-medium text-forest"
              >
                <img src="assets/img/OneRecipe-Page/schedule.svg" alt="" class="h-5 w-5" />
                Cooking time: {{ recipe.cookingTimeMinutes }}min
              </span>
              <span class="font-quicksand text-xl leading-6 font-medium text-mid-green">
                {{ recipe.title }}
              </span>
            </span>

            <span class="flex shrink-0 flex-wrap items-center justify-end gap-2.5">
              @for (tag of recipe.tags; track tag) {
                <span
                  class="font-quicksand flex h-8 items-center rounded-[30px] bg-mist px-3 text-base leading-none font-medium text-deep-green"
                >
                  {{ tag }}
                </span>
              }
              <span
                class="font-quicksand flex h-8 items-center gap-1 rounded-[30px] bg-sage px-3 text-base leading-none font-medium text-deep-green"
              >
                <app-heart-icon klass="h-3.5 w-4" />
                <span class="sr-only">Likes:</span>
                {{ recipe.likes }}
              </span>
            </span>
          </button>
        </li>
      }
    </ol>

    <nav class="flex items-center justify-center gap-2" aria-label="Pages">
      <button
        type="button"
        (click)="step(-1)"
        [disabled]="page() <= 1"
        aria-label="Previous page"
        class="font-quicksand flex h-9 w-9 items-center justify-center rounded-full text-base font-medium text-forest transition-colors hover:bg-mist disabled:opacity-40 disabled:hover:bg-transparent"
      >
        &#8249;
      </button>

      @for (item of pageItems(); track $index) {
        @if (item === gap) {
          <span class="font-quicksand px-1 text-base font-medium text-forest/60">{{ gap }}</span>
        } @else {
          <button
            type="button"
            (click)="goToPage(item)"
            [attr.aria-current]="item === page() ? 'page' : null"
            class="font-quicksand flex h-9 min-w-9 items-center justify-center rounded-full px-2 text-base font-medium transition-colors"
            [class]="
              item === page()
                ? 'bg-forest text-creme'
                : 'text-forest hover:bg-mist'
            "
          >
            {{ item }}
          </button>
        }
      }

      <button
        type="button"
        (click)="step(1)"
        [disabled]="page() >= totalPages()"
        aria-label="Next page"
        class="font-quicksand flex h-9 w-9 items-center justify-center rounded-full text-base font-medium text-forest transition-colors hover:bg-mist disabled:opacity-40 disabled:hover:bg-transparent"
      >
        &#8250;
      </button>
    </nav>
  </main>
</div>
