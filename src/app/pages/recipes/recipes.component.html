<div class="flex min-h-screen flex-col gap-16 bg-white pb-16">
  <header
    class="mx-auto flex w-full max-w-[1466px] flex-col gap-6 px-4 pt-6 sm:gap-9 sm:px-[68px] sm:pt-10"
  >
    <div class="flex w-full items-center justify-between">
      <a routerLink="/" aria-label="Code à Cuisine – Home" class="w-fit">
        <app-logo variant="color" klass="h-10 w-auto sm:h-12" />
      </a>
      <app-logout-button klass="flex h-11 w-11 shrink-0 items-center justify-center text-forest transition-colors hover:text-deep-green" />
    </div>

    <div class="flex flex-col">
      <button
        type="button"
        (click)="goBack()"
        class="font-quicksand flex w-fit items-center gap-2.5 text-base font-medium text-forest transition-colors hover:text-deep-green"
      >
        <img src="assets/img/arrow-back.svg" alt="" class="h-[14px] w-5" />
        Cookbook
      </button>

      <button
        type="button"
        (click)="generate()"
        class="font-quicksand hidden items-center gap-2.5 self-end bg-forest px-[26px] py-4 text-2xl leading-[30px] font-semibold text-creme transition-colors hover:bg-[#2d4c2d] sm:flex"
      >
        Generate a recipe
      </button>
    </div>
  </header>

  <main class="mx-auto flex w-full max-w-[1466px] flex-col gap-10 px-4 sm:px-[68px]">
    <!--
      The banner artwork carries its own creme bar, so scaling it by width made
      the bar collapse on narrow screens. Instead the bar is this container
      (same colour, height under our control) and the artwork is shown through
      two edge slices that are scaled by height - the illustrations therefore
      keep their proportions at every width, and the artwork's own bar simply
      blends into the container.
    -->
    <div
      class="relative flex h-[45px] items-center justify-center rounded-[10px] bg-creme sm:h-20"
    >
      <div
        class="pointer-events-none absolute top-1/2 left-0 h-[90%] w-1/2 -translate-y-1/2 overflow-hidden sm:h-[180%]"
      >
        <img [src]="banner()" alt="" class="absolute top-0 left-0 h-full w-auto max-w-none" />
      </div>
      <div
        class="pointer-events-none absolute top-1/2 right-0 h-[90%] w-1/2 -translate-y-1/2 overflow-hidden sm:h-[180%]"
      >
        <img
          [src]="banner()"
          alt=""
          aria-hidden="true"
          class="absolute top-0 right-0 h-full w-auto max-w-none"
        />
      </div>

      <h1
        class="font-quicksand relative px-[70px] text-center text-[18px] leading-none font-semibold text-deep-green sm:px-0 sm:text-[40px] sm:leading-[1.04] sm:font-bold"
      >
        {{ category().label }}
      </h1>
    </div>

    <ol class="flex flex-col">
      @for (recipe of recipes(); track recipe.id; let i = $index) {
        <li>
          <button
            type="button"
            (click)="openRecipe(recipe)"
            class="flex w-full flex-col gap-2 rounded-2xl px-3 py-3 text-left transition-colors hover:bg-creme sm:flex-row sm:items-center sm:gap-4 sm:px-4"
          >
            <span class="flex min-w-0 items-center gap-3 sm:contents">
              <span
                class="font-quicksand flex h-[30px] min-w-[30px] shrink-0 items-center justify-center rounded-full bg-[#f6e3cf] px-1 text-base leading-none font-semibold text-mid-green"
              >
                {{ rowNumber(i) }}.
              </span>

              <span class="flex min-w-0 flex-1 flex-col gap-1">
                <span
                  class="font-quicksand flex items-center gap-1.5 text-base leading-5 font-medium text-forest"
                >
                  <img src="assets/img/OneRecipe-Page/schedule.svg" alt="" class="h-5 w-5 shrink-0" />
                  Cooking time: {{ recipe.cookingTimeMinutes }}min
                </span>
                <span class="font-quicksand text-xl leading-6 font-medium text-mid-green">
                  {{ recipe.title }}
                </span>
              </span>
            </span>

            <span class="flex flex-wrap items-center gap-2.5 sm:shrink-0 sm:justify-end">
              @for (tag of recipe.tags; track tag) {
                <span
                  class="font-quicksand flex h-8 items-center rounded-[30px] bg-mist px-3 text-base leading-none font-medium text-deep-green"
                >
                  {{ tag }}
                </span>
              }
              <span
                class="font-quicksand flex h-8 items-center gap-1 rounded-[30px] bg-sage px-3 text-base leading-none font-medium text-deep-green"
              >
                <app-heart-icon klass="h-3.5 w-4" />
                <span class="sr-only">Likes:</span>
                {{ recipe.likes }}
              </span>
            </span>
          </button>
        </li>
      }
    </ol>

    <nav class="flex items-center justify-center gap-2" aria-label="Pages">
      <button
        type="button"
        (click)="step(-1)"
        [disabled]="page() <= 1"
        aria-label="Previous page"
        class="font-quicksand flex h-9 w-9 items-center justify-center rounded-full text-base font-medium text-forest transition-colors hover:bg-mist disabled:opacity-40 disabled:hover:bg-transparent"
      >
        &#8249;
      </button>

      @for (item of pageItems(); track $index) {
        @if (item === gap) {
          <span class="font-quicksand px-1 text-base font-medium text-forest/60">{{ gap }}</span>
        } @else {
          <button
            type="button"
            (click)="goToPage(item)"
            [attr.aria-current]="item === page() ? 'page' : null"
            class="font-quicksand flex h-9 min-w-9 items-center justify-center rounded-full px-2 text-base font-medium transition-colors"
            [class]="
              item === page()
                ? 'bg-forest text-creme'
                : 'text-forest hover:bg-mist'
            "
          >
            {{ item }}
          </button>
        }
      }

      <button
        type="button"
        (click)="step(1)"
        [disabled]="page() >= totalPages()"
        aria-label="Next page"
        class="font-quicksand flex h-9 w-9 items-center justify-center rounded-full text-base font-medium text-forest transition-colors hover:bg-mist disabled:opacity-40 disabled:hover:bg-transparent"
      >
        &#8250;
      </button>
    </nav>

    <button
      type="button"
      (click)="generate()"
      class="font-quicksand flex items-center justify-center gap-2.5 self-center bg-forest px-[26px] py-4 text-xl leading-6 font-semibold text-creme transition-colors hover:bg-[#2d4c2d] sm:hidden"
    >
      Generate a recipe
    </button>
  </main>
</div>
