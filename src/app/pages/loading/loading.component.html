<div class="flex min-h-screen flex-col bg-forest">
  <header class="flex items-center justify-between px-4 pt-6 sm:px-[68px] sm:pt-10">
    <app-logo klass="h-10 w-auto sm:h-12" />
    <app-logout-button klass="flex h-11 w-11 shrink-0 items-center justify-center text-creme/70 transition-colors hover:text-creme" />
  </header>

  <main
    class="flex flex-1 flex-col items-center justify-center gap-8 px-4 pb-24"
    role="status"
    aria-live="polite"
    aria-label="Recipes are being generated">
    <div class="loader-card relative h-[309px] w-[253px] overflow-hidden rounded-[20px] bg-sage">
      <img
        src="assets/img/Loading-Page/bowl.svg"
        alt=""
        class="loader-bowl absolute bottom-[46px] left-1/2 w-[150px] -translate-x-1/2"
        (error)="hideMissing($event)" />

      @for (item of items; track item.file) {
        <div
          class="loader-item-pos absolute"
          [style.left.px]="item.left"
          [style.top.px]="item.top"
          [class.loader-stir-veg]="item.stir === 'veg'"
          [class.loader-stir-spoon]="item.stir === 'spoon'"
          [class.loader-pour]="item.pour"
          [style.--stir-distance]="(item.stirDistance ?? 0) + 'px'"
          [style.--pour-rotate]="(item.pourRotate ?? 0) + 'deg'"
          [style.animation-delay]="item.pour ? pourDelay(item) : stirDelay()">
          <img
            [src]="'assets/img/Loading-Page/' + item.file"
            alt=""
            class="loader-item"
            [style.width.px]="item.width"
            [style.--item-rotate]="item.rotate + 'deg'"
            [style.animation-delay]="item.delay + 's'"
            (error)="hideMissing($event)" />
        </div>
      }

      <!-- Second, identical copy in front of the items: since bowl.svg is a
           solid silhouette (not a real hollow bowl), whatever an item's
           bottom overlaps here gets hidden, so it looks tucked into the bowl. -->
      <img
        src="assets/img/Loading-Page/bowl.svg"
        alt=""
        class="loader-bowl absolute bottom-[46px] left-1/2 w-[150px] -translate-x-1/2"
        (error)="hideMissing($event)" />
    </div>

    <p class="font-quicksand text-[32px] leading-none font-bold text-creme">
      Generating
      <span aria-hidden="true">
        <span class="loader-dot">.</span><span class="loader-dot">.</span><span class="loader-dot">.</span>
      </span>
    </p>
  </main>

  <app-not-enough-modal
    [open]="notice()"
    [title]="noticeTitle()"
    [message]="noticeMessage()"
    (closed)="closeNotice()" />
</div>
