<div class="flex min-h-screen flex-col bg-forest">
  <header class="px-4 pt-6 sm:px-[68px] sm:pt-10">
    <app-logo klass="h-10 w-auto sm:h-12" />
  </header>

  <main
    class="flex flex-1 flex-col items-center justify-center gap-8 px-4 pb-24"
    role="status"
    aria-live="polite"
    aria-label="Rezepte werden generiert">
    <div class="loader-card relative h-[309px] w-[253px] overflow-hidden rounded-[20px] bg-sage">
      <img
        src="assets/img/Loading-Page/bowl.svg"
        alt=""
        class="loader-bowl absolute bottom-[46px] left-1/2 w-[150px] -translate-x-1/2"
        (error)="hideMissing($event)" />

      @for (item of items; track item.file; let i = $index) {
        <img
          [src]="'assets/img/Loading-Page/' + item.file"
          alt=""
          class="loader-item absolute"
          [style.left.px]="item.left"
          [style.top.px]="item.top"
          [style.width.px]="item.width"
          [style.--item-rotate]="item.rotate + 'deg'"
          [style.animation-delay]="itemDelay(i)"
          (error)="hideMissing($event)" />
      }

      <img
        src="assets/img/Loading-Page/bowl-front.svg"
        alt=""
        class="loader-bowl absolute bottom-[46px] left-1/2 w-[150px] -translate-x-1/2"
        (error)="hideMissing($event)" />
    </div>

    <p class="font-quicksand text-[32px] leading-none font-bold text-creme">
      Generating
      <span aria-hidden="true">
        <span class="loader-dot">.</span><span class="loader-dot">.</span><span class="loader-dot">.</span>
      </span>
    </p>
  </main>

  <app-not-enough-modal [open]="notEnough()" (closed)="closeNotEnough()" />
</div>
