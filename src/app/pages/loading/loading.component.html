<div class="flex min-h-screen flex-col bg-forest">
  <header class="mx-auto flex w-full max-w-[1466px] items-center justify-between px-4 pt-6 sm:px-[68px] sm:pt-10">
    <app-logo klass="h-10 w-auto sm:h-12" />
    <app-logout-button klass="flex h-11 w-11 shrink-0 items-center justify-center text-creme/70 transition-colors hover:text-creme" />
  </header>

  <main
    class="flex flex-1 flex-col items-center justify-center gap-8 px-4 pb-24"
    role="status"
    aria-live="polite"
    aria-label="Recipes are being generated">
    <div class="relative h-[309px] w-[253px] overflow-hidden rounded-[20px] bg-sage">
      <div class="scene" aria-hidden="true">
        <img class="scene__item scene__bowl" src="assets/img/Loading-Page/bowl.svg" alt="" />

        <div class="scene__fill">
          <img class="scene__item scene__leaf--left" src="assets/img/Loading-Page/salad.svg" alt="" />
          <img class="scene__item scene__leaf--center" src="assets/img/Loading-Page/salad.svg" alt="" />
          <img class="scene__item scene__tomato" src="assets/img/Loading-Page/tomato.svg" alt="" />
          <img class="scene__item scene__carrot" src="assets/img/Loading-Page/carrot.svg" alt="" />
          <img class="scene__item scene__pepper-grains" src="assets/img/Loading-Page/pepper.svg" alt="" />
          <img class="scene__item scene__salt-grains" src="assets/img/Loading-Page/salt.svg" alt="" />
          <img class="scene__item scene__spoon" src="assets/img/Loading-Page/spoon.svg" alt="" />
        </div>

        <img class="scene__item scene__mill" src="assets/img/Loading-Page/pepper-mill.svg" alt="" />
        <img class="scene__item scene__shaker" src="assets/img/Loading-Page/salt-shaker.svg" alt="" />
      </div>
    </div>

    <h1 class="font-quicksand text-[32px] leading-none font-bold text-creme">
      Generating
      <span aria-hidden="true">
        <span class="loader-dot">.</span><span class="loader-dot">.</span><span class="loader-dot">.</span>
      </span>
    </h1>
  </main>

  <app-not-enough-modal
    [open]="notice()"
    [title]="noticeTitle()"
    [message]="noticeMessage()"
    (closed)="closeNotice()" />
</div>
