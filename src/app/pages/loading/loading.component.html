<div class="flex min-h-screen flex-col bg-forest">
  <header class="flex items-center justify-between px-4 pt-6 sm:px-[68px] sm:pt-10">
    <app-logo klass="h-10 w-auto sm:h-12" />
    <app-logout-button klass="flex h-11 w-11 shrink-0 items-center justify-center text-creme/70 transition-colors hover:text-creme" />
  </header>

  <main
    class="flex flex-1 flex-col items-center justify-center gap-8 px-4 pb-24"
    role="status"
    aria-live="polite"
    aria-label="Recipes are being generated">
    <!--
      The bowl choreography - the ingredients dropping in, the pepper mill and
      the salt shaker turning in from outside and seasoning, then the spoon
      stirring - is assembled here from the single SVGs in
      assets/img/Loading-Page. Every part is a vector, so the scene stays sharp
      on any display, and its timing lives in loading.component.css
      (see --loader-cycle there).

      The mill, the shaker and the spoon reach past the card on purpose;
      `overflow-hidden` clips them, which is what makes them appear from outside
      the card instead of popping in at its edge.
    -->
    <div class="relative h-[309px] w-[253px] overflow-hidden rounded-[20px] bg-sage">
      <!--
        The bowl's own rim curve, taken from bowl.svg and expressed as a
        fraction of the scene box. Everything inside .scene__fill is clipped
        along it, which is what puts the ingredients in the bowl instead of
        behind it. Recalculate this path if the bowl's size or position in
        loading.component.css changes.
      -->
      <svg class="scene-defs" aria-hidden="true" focusable="false" width="0" height="0">
        <clipPath id="loader-bowl-rim" clipPathUnits="objectBoundingBox">
          <path d="M0,0 L1,0 L1,1 L.7984,1 L.7984,.5775 C.7281,.6166 .6268,.6293 .5020,.6293 C.3772,.6293 .2783,.6156 .2056,.5775 L.2056,1 L0,1 Z" />
        </clipPath>
      </svg>

      <div class="scene" aria-hidden="true">
        <img class="scene__item scene__bowl" src="assets/img/Loading-Page/bowl.svg" alt="" />

        <div class="scene__fill">
          <img class="scene__item scene__leaf--left" src="assets/img/Loading-Page/salad.svg" alt="" />
          <img class="scene__item scene__leaf--center" src="assets/img/Loading-Page/salad.svg" alt="" />
          <img class="scene__item scene__tomato" src="assets/img/Loading-Page/tomato.svg" alt="" />
          <img class="scene__item scene__carrot" src="assets/img/Loading-Page/carrot.svg" alt="" />
          <img class="scene__item scene__pepper-grains" src="assets/img/Loading-Page/pepper.svg" alt="" />
          <img class="scene__item scene__salt-grains" src="assets/img/Loading-Page/salt.svg" alt="" />
          <img class="scene__item scene__spoon" src="assets/img/Loading-Page/spoon.svg" alt="" />
        </div>

        <img class="scene__item scene__mill" src="assets/img/Loading-Page/pepper-mill.svg" alt="" />
        <img class="scene__item scene__shaker" src="assets/img/Loading-Page/salt-shaker.svg" alt="" />
      </div>
    </div>

    <p class="font-quicksand text-[32px] leading-none font-bold text-creme">
      Generating
      <span aria-hidden="true">
        <span class="loader-dot">.</span><span class="loader-dot">.</span><span class="loader-dot">.</span>
      </span>
    </p>
  </main>

  <app-not-enough-modal
    [open]="notice()"
    [title]="noticeTitle()"
    [message]="noticeMessage()"
    (closed)="closeNotice()" />
</div>
