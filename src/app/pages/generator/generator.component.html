<div class="flex min-h-screen flex-col items-center gap-16 bg-white pb-16">
  <header class="flex w-full items-center justify-between px-4 pt-6 sm:px-[68px] sm:pt-10">
    <a routerLink="/" aria-label="Code à Cuisine – Home">
      <app-logo variant="color" klass="h-10 w-auto sm:h-12" />
    </a>
    <app-logout-button klass="flex h-11 w-11 shrink-0 items-center justify-center text-forest transition-colors hover:text-deep-green" />
  </header>

  <main class="flex w-full max-w-[1087px] flex-1 flex-col items-center gap-6 px-4 sm:px-8">
    <h1
      class="font-quicksand text-center text-[36px] leading-tight font-semibold text-mid-green sm:text-[54px] sm:leading-[65px]">
      Generate recipe
    </h1>
    <p class="font-quicksand pb-12 text-center text-lg font-medium text-deep-green sm:text-2xl">
      Got random stuff in your kitchen? Pop it in—we've got the perfect recipe waiting.
    </p>

    <div class="flex w-full flex-col gap-8 sm:flex-row">
      <div class="flex flex-col gap-8 rounded-[20px] bg-forest/30 px-6 py-6 sm:max-w-[577px] sm:flex-1 sm:py-[25px]">
        <app-ingredient-quantity-form (add)="addIngredient($event)" />
      </div>
      <div class="flex-1 rounded-[20px] bg-forest/30 p-6">
        <app-ingredient-entry-list
          [entries]="ingredients()"
          (update)="updateIngredient($event)"
          (remove)="removeIngredient($event)" />
      </div>
    </div>

    <button
      type="button"
      (click)="handleNextStep()"
      [disabled]="ingredients().length === 0"
      class="font-quicksand mt-[22px] flex items-center gap-2.5 self-end rounded-none bg-forest px-[26px] py-4 text-base font-semibold text-white transition-colors hover:bg-[#2d4c2d] disabled:cursor-not-allowed disabled:hover:bg-forest">
      Next step
    </button>
  </main>
</div>
