<div class="flex min-h-screen flex-col overflow-x-hidden bg-creme">
  <app-site-header />
  <main class="mx-auto flex w-full max-w-[420px] flex-1 flex-col justify-center px-4 py-10 sm:px-8">
    <div class="flex gap-2 rounded-full bg-sage/40 p-1">
      <button
        type="button"
        (click)="setMode('login')"
        class="font-quicksand h-11 flex-1 rounded-full text-base font-medium transition-colors"
        [class.bg-forest]="mode() === 'login'"
        [class.text-creme]="mode() === 'login'"
        [class.text-forest]="mode() !== 'login'">
        Anmelden
      </button>
      <button
        type="button"
        (click)="setMode('register')"
        class="font-quicksand h-11 flex-1 rounded-full text-base font-medium transition-colors"
        [class.bg-forest]="mode() === 'register'"
        [class.text-creme]="mode() === 'register'"
        [class.text-forest]="mode() !== 'register'">
        Registrieren
      </button>
    </div>

    <h1 class="font-ubuntu mt-6 mb-4 text-2xl font-bold text-forest-dark">
      {{ mode() === "register" ? "Konto erstellen" : "Willkommen zurück" }}
    </h1>

    <form class="flex flex-col gap-4" (ngSubmit)="submit()">
      <label class="font-quicksand flex flex-col gap-1 text-base text-forest-dark">
        E-Mail
        <input
          type="email"
          name="email"
          [(ngModel)]="email"
          required
          autocomplete="email"
          class="font-quicksand h-12 w-full rounded-md border border-forest/30 bg-white px-3 text-base focus-visible:ring-2 focus-visible:ring-forest focus-visible:outline-none" />
      </label>

      <label class="font-quicksand flex flex-col gap-1 text-base text-forest-dark">
        Passwort
        <input
          type="password"
          name="password"
          [(ngModel)]="password"
          required
          [minlength]="mode() === 'register' ? 8 : 1"
          [autocomplete]="mode() === 'register' ? 'new-password' : 'current-password'"
          class="font-quicksand h-12 w-full rounded-md border border-forest/30 bg-white px-3 text-base focus-visible:ring-2 focus-visible:ring-forest focus-visible:outline-none" />
        @if (mode() === "register") {
          <span class="font-quicksand text-sm text-forest/60">{{ passwordHint }}</span>
        }
      </label>

      @if (errorMessage(); as message) {
        <p class="font-quicksand text-base text-red-700" role="alert">{{ message }}</p>
      }

      <button
        type="submit"
        [disabled]="loading()"
        class="font-quicksand mt-2 flex h-12 items-center justify-center rounded-md bg-forest px-5 text-base text-creme hover:bg-[#2d4c2d] disabled:opacity-60">
        {{ mode() === "register" ? "Konto erstellen" : "Anmelden" }}
      </button>
    </form>

    <div class="my-6 flex items-center gap-3">
      <div class="h-px flex-1 bg-forest/20"></div>
      <span class="font-quicksand text-base text-forest/60">oder</span>
      <div class="h-px flex-1 bg-forest/20"></div>
    </div>

    <button
      type="button"
      (click)="submitWithGoogle()"
      [disabled]="loading()"
      class="font-quicksand flex h-12 items-center justify-center rounded-md border border-forest/30 bg-white px-5 text-base text-forest-dark hover:bg-sage/20 disabled:opacity-60">
      Mit Google anmelden
    </button>

    <a routerLink="/" class="font-quicksand mt-8 text-center text-base text-forest/70 hover:text-forest">
      Zurück zur Startseite
    </a>
  </main>
</div>
