<div class="flex min-h-screen flex-col overflow-x-hidden bg-forest">
  <app-site-header />
  <main class="mx-auto flex w-full max-w-[420px] flex-1 flex-col justify-center px-4 py-10 sm:px-8">
    <div class="flex gap-2 rounded-full bg-creme/10 p-1">
      <button
        type="button"
        (click)="setMode('login')"
        class="font-quicksand h-11 flex-1 rounded-full text-base font-medium transition-colors"
        [class.bg-sage]="mode() === 'login'"
        [class.text-deep-green]="mode() === 'login'"
        [class.text-creme]="mode() !== 'login'"
        [class.hover:bg-creme]="mode() !== 'login'"
        [class.hover:text-deep-green]="mode() !== 'login'">
        Log in
      </button>
      <button
        type="button"
        (click)="setMode('register')"
        class="font-quicksand h-11 flex-1 rounded-full text-base font-medium transition-colors"
        [class.bg-sage]="mode() === 'register'"
        [class.text-deep-green]="mode() === 'register'"
        [class.text-creme]="mode() !== 'register'"
        [class.hover:bg-creme]="mode() !== 'register'"
        [class.hover:text-deep-green]="mode() !== 'register'">
        Sign up
      </button>
    </div>

    <h1 class="font-ubuntu mt-6 mb-4 text-2xl font-bold text-creme">
      {{ mode() === "register" ? "Create an account" : "Welcome back" }}
    </h1>

    <form class="flex flex-col gap-4" (ngSubmit)="submit()">
      <label class="font-quicksand flex flex-col gap-1 text-base text-creme">
        Email
        <input
          type="email"
          name="email"
          [(ngModel)]="email"
          required
          autocomplete="email"
          class="font-quicksand h-12 w-full rounded-md border border-creme/30 bg-creme px-3 text-base text-deep-green focus-visible:ring-2 focus-visible:ring-creme focus-visible:outline-none" />
      </label>

      <label class="font-quicksand flex flex-col gap-1 text-base text-creme">
        Password
        <input
          type="password"
          name="password"
          [(ngModel)]="password"
          required
          [minlength]="mode() === 'register' ? 8 : 1"
          [autocomplete]="mode() === 'register' ? 'new-password' : 'current-password'"
          class="font-quicksand h-12 w-full rounded-md border border-creme/30 bg-creme px-3 text-base text-deep-green focus-visible:ring-2 focus-visible:ring-creme focus-visible:outline-none" />
        @if (mode() === "register") {
          <span class="font-quicksand text-base text-creme/70">{{ passwordHint }}</span>
        }
      </label>

      @if (errorMessage(); as message) {
        <p class="font-quicksand text-base font-medium text-peach" role="alert">{{ message }}</p>
      }

      <button
        type="submit"
        [disabled]="loading()"
        class="font-quicksand mt-2 flex h-12 items-center justify-center rounded-md bg-sage px-5 text-base font-medium text-deep-green transition-colors hover:bg-creme disabled:opacity-60">
        {{ mode() === "register" ? "Create account" : "Log in" }}
      </button>
    </form>

    <div class="my-6 flex items-center gap-3">
      <div class="h-px flex-1 bg-creme/30"></div>
      <span class="font-quicksand text-base text-creme/70">or</span>
      <div class="h-px flex-1 bg-creme/30"></div>
    </div>

    <button
      type="button"
      (click)="submitWithGoogle()"
      [disabled]="loading()"
      class="font-quicksand flex h-12 items-center justify-center rounded-md border border-creme/40 px-5 text-base text-creme transition-colors hover:bg-creme/10 disabled:opacity-60">
      Continue with Google
    </button>

    <a
      routerLink="/"
      class="font-quicksand mt-8 text-center text-base text-creme/70 transition-colors hover:text-creme">
      Back to home
    </a>
  </main>
</div>
