<div class="plates z-0" aria-hidden="true">
  <!-- Two stacks rather than one with toggled items: the overlap is applied to
       every plate but the first, and a hidden element would still count as a
       sibling and leave a gap where it sits. -->
  <div class="plates__stack flex flex-col min-[1440px]:hidden">
    <img src="assets/img/hero/plate-top.webp" alt="" class="plates__item" />
    <img src="assets/img/hero/plate-middle.webp" alt="" class="plates__item" />
    <img src="assets/img/hero/plate-bottom.webp" alt="" class="plates__item" />
  </div>

  <!-- The widescreen plates only from 1440px, as the design file notes next to
       the widescreen frame ("Verwende die Teller ab 1440px"). Below that the
       desktop layout keeps the same three plates as the phone, only larger. -->
  <div class="plates__stack hidden flex-col min-[1440px]:flex">
    <img src="assets/img/hero/widescreen/Gemüse-Teller.webp" alt="" class="plates__item" />
    <img src="assets/img/hero/widescreen/Lachs-Teller.webp" alt="" class="plates__item" />
    <img src="assets/img/hero/widescreen/Stake-Teller.webp" alt="" class="plates__item" />
    <img src="assets/img/hero/widescreen/Hähnchen-Teller.webp" alt="" class="plates__item" />
    <img src="assets/img/hero/widescreen/Baguette-Teller.webp" alt="" class="plates__item" />
  </div>
</div>
