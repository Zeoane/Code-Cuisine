<!-- Name and amount side by side only from lg (1024px): the panel shares
     the row with the ingredient list from md on, and at 768px a side-by-side
     form left the name field under 100px wide. -->
<div class="flex flex-1 flex-col gap-6 lg:flex-row lg:items-start lg:gap-8">
  <div class="relative flex flex-1 flex-col gap-2">
    <label for="ingredient-name" class="font-quicksand text-xl font-medium text-deep-green"> Ingredient </label>
    <input
      id="ingredient-name"
      type="text"
      [ngModel]="name"
      (ngModelChange)="handleNameInput($event)"
      (keydown)="handleKeydown($event)"
      (focus)="handleNameInput(name)"
      (blur)="handleBlur()"
      maxlength="64"
      autocomplete="off"
      role="combobox"
      aria-autocomplete="list"
      aria-controls="ingredient-suggestions"
      [attr.aria-expanded]="showSuggestions()"
      [attr.aria-activedescendant]="activeIndex() >= 0 ? optionId(activeIndex()) : null"
      class="h-9 w-full rounded-[20px] bg-creme/80 px-4 font-quicksand text-base text-forest-dark focus-visible:outline-none" />

    <!-- The options carry no button: an option must not contain a focusable
         element, and focus stays in the input so the arrow keys can walk the
         list. Pointer users are served by mousedown, which fires before the
         input's blur would close the list. -->
    @if (showSuggestions()) {
      <ul
        id="ingredient-suggestions"
        role="listbox"
        aria-label="Ingredient suggestions"
        class="scrollbar-none mt-1 max-h-64 w-full overflow-y-auto overscroll-contain rounded-2xl px-1 py-1">
        @for (item of suggestions(); track item; let i = $index) {
          <li
            role="option"
            [id]="optionId(i)"
            [attr.aria-selected]="i === activeIndex()"
            (mousedown)="handleSuggestionMouseDown($event, item)"
            [class]="
              'font-quicksand block w-full cursor-pointer rounded-[10px] px-4 py-1.5 text-left text-base text-forest-dark transition-colors hover:bg-creme/80 ' +
              (i === activeIndex() ? 'bg-creme/80' : '')
            ">
            {{ item }}
          </li>
        }
      </ul>
    }
  </div>

  <div class="flex flex-col gap-2">
    <span class="font-quicksand text-xl font-medium text-deep-green">Serving size</span>
    <div class="flex items-start gap-2.5">
      <input
        type="number"
        min="0"
        [value]="quantity"
        (input)="handleQuantityInput($event)"
        aria-label="Quantity"
        class="h-9 w-[61px] rounded-full bg-creme px-2 text-center font-quicksand text-base text-forest-dark focus-visible:outline-none" />
      <app-unit-select [value]="unit" (valueChange)="unit = $event" size="md" />
      <button
        type="button"
        (click)="submit()"
        [disabled]="!name.trim() || quantity <= 0"
        aria-label="Add ingredient"
        class="tap-target flex h-9 w-9 shrink-0 items-center justify-center rounded-full transition-colors hover:bg-creme disabled:opacity-40 disabled:hover:bg-transparent">
        <img src="assets/img/Generate-Page/add_2.svg" alt="" class="h-6 w-6" />
      </button>
    </div>
  </div>
</div>
