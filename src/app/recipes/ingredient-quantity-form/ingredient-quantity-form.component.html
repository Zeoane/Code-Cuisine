<div class="flex flex-1 flex-col gap-6 sm:flex-row sm:items-start sm:gap-8">
  <div class="relative flex flex-1 flex-col gap-2">
    <label for="ingredient-name" class="font-quicksand text-xl font-medium text-deep-green"> Ingredient </label>
    <input
      id="ingredient-name"
      type="text"
      [ngModel]="name"
      (ngModelChange)="handleNameInput($event)"
      (keydown)="handleKeydown($event)"
      (focus)="handleNameInput(name)"
      (blur)="handleBlur()"
      maxlength="64"
      autocomplete="off"
      class="h-9 w-full rounded-[20px] bg-creme/80 px-4 font-quicksand text-base text-forest-dark focus:outline-none" />

    @if (showSuggestions()) {
      <ul role="listbox" class="mt-1 w-full overflow-hidden rounded-2xl px-1 py-1">
        @for (item of suggestions(); track item) {
          <li role="option">
            <button
              type="button"
              (mousedown)="handleSuggestionMouseDown($event, item)"
              class="font-quicksand block w-full rounded-[10px] px-4 py-1.5 text-left text-base text-forest-dark transition-colors hover:bg-creme/80">
              {{ item }}
            </button>
          </li>
        }
      </ul>
    }
  </div>

  <div class="flex flex-col gap-2">
    <span class="font-quicksand text-xl font-medium text-deep-green">Serving size</span>
    <div class="flex items-start gap-2.5">
      <input
        type="number"
        min="0"
        [value]="quantity"
        (input)="handleQuantityInput($event)"
        aria-label="Menge"
        class="h-9 w-[61px] rounded-full bg-creme px-2 text-center font-quicksand text-sm text-forest-dark focus-visible:outline-none" />
      <app-unit-select [value]="unit" (valueChange)="unit = $event" size="md" />
      <button
        type="button"
        (click)="submit()"
        [disabled]="!name.trim() || quantity <= 0"
        aria-label="Zutat hinzufügen"
        class="flex h-9 w-9 shrink-0 items-center justify-center rounded-full transition-colors hover:bg-creme disabled:opacity-40 disabled:hover:bg-transparent">
        <img src="assets/img/Generate-Page/add_2.svg" alt="" class="h-6 w-6" />
      </button>
    </div>
  </div>
</div>
