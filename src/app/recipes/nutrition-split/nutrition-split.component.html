@if (shares().length) {
  <div class="flex flex-col gap-2">
    <div class="flex h-2 w-full gap-0.5" role="img" [attr.aria-label]="'Energy split: ' + summary()">
      @for (macro of barShares(); track macro.key) {
        <span
          [class]="'h-full first:rounded-l last:rounded-r ' + fill(macro.key)"
          [style.width.%]="macro.percent"
          [title]="macro.label + ' ' + macro.percent + '% · ' + macro.grams + 'g'"></span>
      }
    </div>
    <ul class="font-quicksand flex flex-wrap items-center gap-x-4 gap-y-1">
      @for (macro of shares(); track macro.key) {
        <li class="flex items-center gap-1.5 text-base leading-none font-medium text-deep-green">
          <span [class]="'h-2.5 w-2.5 rounded-sm ' + fill(macro.key)" aria-hidden="true"></span>
          {{ macro.label }} {{ macro.percent }}%
        </li>
      }
    </ul>
  </div>
}
