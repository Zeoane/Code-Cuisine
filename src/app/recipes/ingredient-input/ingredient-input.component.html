<div class="flex w-full flex-col gap-4">
  <div class="flex flex-col gap-2 sm:flex-row">
    <input
      type="text"
      name="ingredient"
      [(ngModel)]="value"
      (keydown)="handleKeydown($event)"
      placeholder="z. B. Tomaten, Reis, Hähnchen …"
      maxlength="64"
      [disabled]="disabled"
      aria-label="Zutat hinzufügen"
      class="font-quicksand h-12 w-full rounded-md border border-forest/30 bg-white px-3 text-base focus-visible:ring-2 focus-visible:ring-forest focus-visible:outline-none" />
    <button
      type="button"
      (click)="addIngredient()"
      [disabled]="disabled || !value.trim()"
      class="font-quicksand flex h-12 items-center justify-center gap-1 rounded-md bg-forest px-5 text-base text-creme hover:bg-[#2d4c2d] disabled:opacity-60">
      <app-icon name="plus" klass="h-4 w-4" />
      Hinzufügen
    </button>
  </div>

  @if (ingredients.length > 0) {
    <ul class="flex flex-wrap gap-2" aria-label="Deine Zutaten">
      @for (item of ingredients; track item) {
        <li
          class="font-quicksand flex items-center gap-1.5 rounded-full bg-forest py-2 pr-2 pl-4 text-base font-medium text-creme">
          {{ item }}
          <button
            type="button"
            (click)="removeIngredient(item)"
            [disabled]="disabled"
            [attr.aria-label]="item + ' entfernen'"
            class="flex h-7 w-7 items-center justify-center rounded-full transition-colors hover:bg-creme/20">
            <app-icon name="close" klass="h-4 w-4" />
          </button>
        </li>
      }
    </ul>
  } @else {
    <p class="font-quicksand text-base text-forest/60">
      Füge mindestens eine Zutat hinzu, um Rezepte zu generieren.
    </p>
  }
</div>
