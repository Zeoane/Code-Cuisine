<dl class="font-quicksand grid grid-cols-2 gap-x-4 gap-y-1 rounded-md bg-beige/60 p-3 text-base sm:grid-cols-4">
  @for (row of rows(); track row[0]) {
    <div>
      <dt class="text-sm text-forest/70">{{ row[0] }}</dt>
      <dd class="font-semibold text-forest-dark">{{ row[1] }}</dd>
    </div>
  }
</dl>
